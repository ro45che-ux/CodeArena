name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Runs the sandbox tests (real hostile programs) and the Spring integration tests on H2.
      - name: Test
        working-directory: backend
        run: mvn --batch-mode verify

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Test
        working-directory: frontend
        run: npm test -- --watchAll=false
        env:
          CI: 'true'
      - name: Build (warnings are errors in CI)
        working-directory: frontend
        run: npm run build
        env:
          CI: 'true'
