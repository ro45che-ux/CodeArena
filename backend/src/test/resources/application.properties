spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

app.jwt.secret=test-secret-test-secret-test-secret-test-secret
app.cors.allowed-origins=http://localhost:3000

judge.run-timeout-ms=3000
judge.compile-timeout-ms=30000
judge.memory-mb=64
judge.max-concurrent=2
judge.submissions-per-minute=1000
judge.allow-unsandboxed=true
