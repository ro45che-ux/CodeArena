# ---- Database ---------------------------------------------------------------
# Values after the colon are LOCAL DEVELOPMENT defaults only. In production set
# SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD as environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coding_platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---- Security ---------------------------------------------------------------
# Secret used to sign login tokens. REQUIRED in production (32+ characters), e.g.
#   openssl rand -base64 48
# If empty, a random secret is generated at start-up (everyone is logged out on restart).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# Browser origins allowed to call this API (comma separated).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,https://code-arena-frontend.onrender.com}

# Never leak stack traces or exception messages in error responses.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ---- Judge ------------------------------------------------------------------
judge.run-timeout-ms=${JUDGE_RUN_TIMEOUT_MS:5000}
judge.compile-timeout-ms=${JUDGE_COMPILE_TIMEOUT_MS:20000}
judge.memory-mb=${JUDGE_MEMORY_MB:128}
judge.max-concurrent=${JUDGE_MAX_CONCURRENT:2}
judge.submissions-per-minute=${JUDGE_SUBMISSIONS_PER_MINUTE:10}
judge.runs-per-minute=${JUDGE_RUNS_PER_MINUTE:30}
judge.use-security-manager=${JUDGE_USE_SECURITY_MANAGER:true}
